# ============================================================
# multiModel 子图 DAG（T3 专属生命周期）
# 由 graph.yaml 的 MM_SUBGRAPH 节点经 provider: multiModel 路由进入。
# 节点 ID 大写蛇形加 MM_ 前缀；执行细节见 agent/multiModel.md（行为）。
# multiModel 同时承担"子图编排者"角色（类比主图 conductor）。
# ============================================================
# 字段说明（与主图 graph.yaml 一致，额外字段）：
#   provider     子图提供者（对应 agent/multiModel.md frontmatter type: lifecycle_provider）
#   entry        子图入口节点
#   exit         子图出口节点（到达后交还 task_context 给 conductor）
#   parallel     节点内多 agent 并行执行（MM_EXECUTING 用）
# ============================================================
version: 2               # v2: 产物级聚合（worktree 隔离 + 代码产物聚合）
provider: multiModel
entry: MM_INIT
exit: MM_ARCHIVED            # 到达 exit 后交还 task_context 给 conductor，回流主图 EXECUTING（由主图 coder git merge 聚合产物），然后走标准 QUALITY→DELIVERING

nodes:
  - id: MM_INIT
    executor: multiModel
    note: 理解+拆分 1-3 个子任务委派包；读 intent/sizing，写 plan.subtasks

  - id: MM_INJECT
    executor: multiModel
    note: M1 等效记忆注入；3 个 coder 相同内容（公平性），降级不阻塞

  - id: MM_WT_SETUP
    executor: multiModel
    on_fail: abort              # 创建失败即降级方案级融合（multiModel 内建清理已创建 worktree 后跳过本节点）
    note: 创建 4 个 worktree（3 coder + 1 fusion）+ 写 execution.mm_worktrees 注册表 + execution.mm_mode="worktree"；
          默认启用 4 个 worktree（与 plan.subtasks 数量无关，每 coder 在自己 worktree 内跨 subtask 连续工作）；
          若 worktree 创建失败则降级方案级融合（plan_level），不阻塞主流程；
          跨平台路径模板——Windows: <repo_root>\.worktrees\mm-<tid>-{coder-a,coder-b,coder-c,fusion}\，
          Unix: <repo_root>/.worktrees/mm-<tid>-{coder-a,coder-b,coder-c,fusion}/；
          fusion worktree base = 主工作区当前分支 HEAD（与 3 coder worktree 同一时间窗口创建）；
          失败 → 标 [MM_WT_DEGRADED]，清理已创建 worktree，降级方案级融合（mm_mode="plan_level"，跳过本节点，MM_EXECUTING 回退方案文本模式）

  - id: MM_EXECUTING
    required: [coder-a, coder-b, coder-c]
    note: 3 coder 各自在隔离 worktree 独立实现代码 → commit 产物；写 execution.mm_outputs（方案摘要，轻量）+ execution.mm_artifacts（产物指针：worktree 路径/分支/commit_sha/diff 摘要/验收映射表）；互不知晓；多样化硬规则：必须不同厂商/架构模型
    parallel: true                            # 并行执行（无 order，视角隔离）

  - id: MM_CHECKING
    required: [verifier]
    note: verifier 对各 worktree 产物执行验证（正确性、边界覆盖、SCOPE_CREEP、风格一致性、验收标准），基于 `execution.mm_artifacts` 中的 diff 摘要与 commit 内容；写 verification.forward

  - id: MM_FUSING
    required: [synthesizer-fusion]
    note: 产物聚合（非方案编辑）；synthesizer-fusion 读 3 份 diff(mm_artifacts) + 验证报告，在 fusion worktree 选基底分支 + 吸收优点 + 解决冲突 + 聚合代码 commit；写 execution.fused_output（聚合产物指针：fusion worktree 路径/分支/commit_sha/聚合 diff 摘要/基底选择/冲突裁决）；隔离硬门不变：不读拆分意图/模型身份/task_context.intent；不碰 execution.diffs/changes/acceptance_map（主图 coder merge 后写入）

  - id: MM_FCHECK
    required: [verifier]
    note: 聚合产物验证（融合自洽性、风格一致性、验收覆盖、矛盾消除质量）；写 verification.forward.fusion_check

  - id: MM_DELIVERING
    executor: multiModel
    note: 终验 acceptance_criteria + M4-M8 记忆溯源（含 3-5 倍 token 记录）+ 清理 3 个 coder worktree（fusion worktree 保留待主图 merge）

  - id: MM_ARCHIVED
    type: terminal
    note: 写 subgraph_status=ready_for_delivery（fusion 分支已就绪）+ status=RUNNING（交还 conductor 后接管）；task_context 交还 conductor 回流主图 EXECUTING（coder 执行 `git merge mm-<tid>-fusion` 将聚合代码产物应用到主工作区，写入 execution.diffs/changes/acceptance_map），然后走标准 QUALITY→DELIVERING（主图 hooks 自动循环验证 merge 后代码产物）

edges:
  - { from: MM_INIT, to: MM_INJECT }
  - { from: MM_INJECT, to: MM_WT_SETUP }
  - { from: MM_WT_SETUP, to: MM_EXECUTING }
  - { from: MM_EXECUTING, to: MM_CHECKING, when: "3 份产物均返回（mm_artifacts 写齐）" }
  - from: MM_CHECKING
    to: MM_FUSING
    when: "至少 1 份 PASS"
  - from: MM_CHECKING
    to: MM_INIT
    when: "3 份全部 FAIL"
    note: 不直接写 quality.round；经 status 信号交还 conductor 计数
  - { from: MM_FUSING, to: MM_FCHECK, gate: FUSION_SELF_CHECK_10 }
  - from: MM_FCHECK
    to: MM_DELIVERING
    when: "fusion_check == 'PASS'"
  - from: MM_FCHECK
    to: MM_FUSING
    when: "fusion_check == 'FAIL'"
    note: 打回重编；连续失败标注"融合失败"由用户决策
  - { from: MM_DELIVERING, to: MM_ARCHIVED }

# 多样化硬规则（从原 capabilities.yaml 迁移，仅本子图使用）
diversity_rule:
  applies_to: [coder-a, coder-b, coder-c]
  dimensions:
    vendor: required         # 模型提供者两两不同
    architecture: required   # 模型架构两两不同
  on_violation: DIVERSITY_VIOLATION

# 降级规则见 agent/multiModel.md §异常处理（唯一真相）
#
# 子图异常处理主权：MM_* 节点不适用主图 graph.yaml 节点级 on_fail 派发
# （abort/retry_once/degrade/escalate/pause）。子图异常按 multiModel.md §异常处理
# 表格处理（coder BLOCKED → 补上下文重试；3 份 FAIL → 用户降级；RATE_LIMIT 3 次 →
# [MULTIMODEL_DEGRADED]；累计 3 次 → [MULTIMODEL_ABANDONED]）。
# timeouts 仍适用：子图智能体经 task 工具启动，per_agent_s 守卫照常生效。
#
# MM_WT_SETUP on_fail: abort —— worktree 创建失败即降级方案级融合（mm_mode="plan_level"），
# multiModel 内建清理已创建 worktree 后跳过 worktree 流程，MM_EXECUTING 回退方案文本模式（现有已验证流程）。
# 降级链：worktree 模式（产物级聚合）→ 方案级融合（mm_mode=plan_level）→
#         single_coder 直办（multiModel 退出，conductor 把 tier 降 T2 重走 PLANNING）→
#         用户决策（[MULTIMODEL_ABANDONED]）。每级降级都清理已创建 worktree。
