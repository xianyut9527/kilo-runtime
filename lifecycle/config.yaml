# ============================================================
# 生命周期配置（定级默认组合 + 用户覆盖 + 熔断阈值）
# conductor 在 SIZING 阶段读取本文件写入 task_context.config；
# 用户可在 prompt 显式声明覆盖（conductor 写入 custom_overrides）。
# 本文件是唯一"定级→智能体组合"声明处，替代原 conductor.md §动态加载矩阵硬编码。
# ============================================================
# tier_defaults：按定级 T0/T1/T2/T3 声明本次任务要加载哪些智能体（布尔开关）
#   - conductor 在 SIZING 阶段把对应 tier 的 agents 表写入 task_context.config.agents
#   - agent frontmatter 的 mount[].when 对照 config.agents.<key> 求值
#       true  → 该 agent 在声明挂载点会被加载
#       false → 跳过该 agent（不影响 required 必配角色——若该角色是节点 required 仍会 [ASSEMBLY_FAIL]）
#   - review_mode：none（无审查）/ full（四视角：正向+反向+侧向+审查）
#   - provider：仅 T3 用，声明子图提供者（对应 graph.yaml MM_SUBGRAPH 节点 provider）
#
# agents 键命名规则（自动派生，无需手写映射表）：
#   键 = agent 文件名去 .md 后连字符转下划线
#   reverse-auditor.md → reverse_auditor
#   side-checker.md    → side_checker
#   synthesizer-fusion.md → synthesizer_fusion
#   coder / planner / verifier / reviewer / fixer 等单词名直接用
#   coder-a/b/c 不单独开关（由 T3 provider 隐含加载）
# ============================================================
version: 1

tier_defaults:
  # T0 极速通道：INTENT → SIZING → EXECUTING → DELIVERING
  # 只加载 coder，无设计门/验证/审查；适合一行命令能搞定的局部修改
  T0:
    agents:
      coder: true
    review_mode: none

  # T1 标准闭环
  # 默认不开反向审计/侧向验证/融合（适合中等复杂度任务）
  T1:
    agents:
      planner: true
      coder: true
      verifier: true
      reviewer: true
      fixer: true
      reverse_auditor: false      # T2+ 才开（需求追溯审计）
      side_checker: false         # T2+ 才开（运行时行为实测）
      synthesizer_fusion: false   # 仅 T3 multiModel 用
    review_mode: full

  # T2 全视角交叉验证：正向+反向+侧向+审查全开
  # 适合复杂任务：架构变更、跨多文件重构、安全敏感改动
  T2:
    agents:
      planner: true
      coder: true
      verifier: true
      reverse_auditor: true       # 需求追溯审计（从产物反推是否满足原始需求）
      side_checker: true          # 运行时行为视角验证（边界/安全/性能/兼容性实测）
      reviewer: true
      fixer: true
      synthesizer_fusion: false   # 仅 T3 multiModel 用
    review_mode: full

  # T3 多模型并行融合：交给 multiModel 子图（lifecycle/multimodel-graph.yaml）
  # 3 个不同厂商/架构的 coder 并行实现，verifier 交叉验证，synthesizer-fusion 独立融合
  # 适合高难度任务：架构设计、关键算法、需要多家之长
  T3:
    provider: multiModel
    agents:
      synthesizer_fusion: true    # 融合编辑智能体（隔离硬门：不读拆分意图/模型身份）
    review_mode: full

# ============================================================
# overrides：用户/环境覆盖（默认全空 = 全量自动发现注册）
# ============================================================
overrides:
  # disabled_agents：全局禁用的智能体名列表
  # 被禁用的 agent 不会被 bootstrap 注册；若该 agent 是某节点 required → [ASSEMBLY_FAIL]
  # 例: [side-checker] → bootstrap 跳过注册 side-checker（但 REVIEWING 节点 required 是 reviewer，不受影响）
  disabled_agents: []

  # model_overrides：覆盖 kilo.json 的模型绑定
  # 键 = agent 名，值 = 模型 ID（能力倾向参考 docs/model-registry.md 人工维护，无机械校验）
  # 例: { verifier: "hx/kimi-k3" } → 本次任务 verifier 用 kimi-k3 而非 kilo.json 默认绑定
  model_overrides: {}

  # condition_overrides：强制覆盖 config.agents 开关
  # 键 = "config.agents.<key>"，值 = true/false
  # 例: { "config.agents.reverse_auditor": true } → 强制加载 reverse-auditor（即使 tier_defaults 关闭）
  condition_overrides: {}

# ============================================================
# convergence：收敛熔断阈值（唯一真相来源）
# conductor 在进入 CHECKING/REVIEWING 前递增 total_rounds
# 达到阈值 → [CIRCUIT_BREAKER] 停止修复，输出选项等用户决策
# ============================================================
convergence:
  max_rounds: 5        # FIXING 单点熔断（同一验证失败点的修复轮次上限）
  max_total_rounds: 7  # CHECKING+REVIEWING 累计进入次数全局熔断

# ============================================================
# timeouts：阶段/智能体级时间预算（唯一真相来源）
# conductor 启动智能体时记录 start_time；超时 → [AGENT_TIMEOUT]
# 按 graph.yaml 节点 on_fail 字段路由（未声明按默认值规则）
#
# 时间模型：
#   agent_startup_s   — task 工具从调用到首次响应的等待上限（启动阶段独立计时）
#                       超过 → [AGENT_TIMEOUT]（启动卡死）；不计入 stage 预算
#   stage_default_s   — 主槽执行时间上限（启动后到智能体返回）；executor: conductor
#                       内建阶段用此值守卫；per_agent_s 未覆盖的智能体回退此值
#   per_agent_s       — 单智能体执行预算（启动后到返回）；按智能体名查表
#   实际预算          — per_agent_s[name] × per_tier_multiplier[tier]（缺 per_agent_s
#                       回退 stage_default_s × multiplier）
#
# 守卫范围：
#   - 经 task 工具启动的外部智能体 → per_agent_s / stage_default_s 守卫
#   - executor: conductor/multiModel 内建阶段 → stage_default_s 守卫（conductor 自身
#     卡住无自动守卫，用户 Ctrl-C 即手动 teardown——开发工具用户在场，不自动销毁）
#   - 子图 MM_* 节点的智能体同样走 task 工具 → per_agent_s 守卫（子图异常处理主权
#     在 agent/multiModel.md §异常处理，不适用主图 on_fail 派发）
# ============================================================
timeouts:
  agent_startup_s: 30      # task 工具启动智能体，30s 未响应 → [AGENT_TIMEOUT]（启动卡死）
  stage_default_s: 600     # 单阶段默认预算（主槽执行时间上限；内建阶段守卫值）
  per_agent_s:
    coder: 1800            # coder 写代码可能较长，给 30min
    coder_a: 1800
    coder_b: 1800
    coder_c: 1800
    verifier: 900
    reverse_auditor: 600
    side_checker: 900
    reviewer: 600
    planner: 600
    fixer: 1200
    synthesizer_fusion: 900
  per_tier_multiplier:     # 定级系数（per_agent_s × multiplier = 实际预算）
    T0: 0.5
    T1: 1.0
    T2: 1.5
    T3: 2.0
  retry:
    # timeout 重试配额：仅当节点 on_fail: retry_once 时生效；
    # retry_once 语义 = "同智能体重跑 1 次（新会话，清空前次上下文）"，
    # 此字段限定 [AGENT_TIMEOUT] 后最多重试次数；与节点 on_fail 协同：
    #   on_fail: retry_once + agent_timeout_max_retries: 1 → 重跑 1 次，再超时转 escalate
    #   on_fail: 非 retry_once → 超时直接按 on_fail 派发（不重试）
    agent_timeout_max_retries: 1

# ============================================================
# on_fail 默认值规则（graph.yaml 节点未声明 on_fail 时按此求值）
#   required 必配阶段 → escalate   （升级路径见 conductor.md §异常处理派发表）
#   可选挂载视角    → degrade     （跳过该视角 + DEGRADED）
#   executor 内建   → pause       （挂起 task_context，输出选项等人）
#   START/DONE/terminal → abort   （硬停）
#
# 取值集（节点级 on_fail，与挂载点 mount[].on_fail 同名但取值不同，按字段位置区分）：
#   节点级  on_fail ∈ {abort, retry_once, degrade, escalate, pause}  ← 主槽失败策略
#   挂载点  mount[].on_fail ∈ {abort, warn, skip}                     ← pre:/post:/on: 失败
# ============================================================
