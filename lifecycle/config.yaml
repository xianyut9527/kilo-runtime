# ============================================================
# 生命周期配置（定级差异化开关 + 用户覆盖 + 熔断阈值）
# conductor 在 INIT 阶段读取本文件写入 task_context.config；
# 用户可在 prompt 显式声明覆盖（conductor 写入 custom_overrides）。
# 本文件是唯一"定级→差异化智能体开关"声明处。
# ============================================================
# v3 简化重构：仅 T0/T1/T2，移除 T3/multiModel/memory 板块
# ============================================================
# 挂载两种模式（新增智能体默认零配置）：
#   1) 恒定挂载（默认，推荐）：frontmatter mount 无 when 且无 tiers —— 图拓扑可达即加载。
#      T0 不经 PLANNING/QUALITY——拓扑即开关。
#      新增智能体丢文件即用，**无需改本文件**。
#   2) 定级挂载（仅"同阶段按 tier 差异化"的智能体）：frontmatter mount 声明
#      tiers: [T1, T2] —— 按当前 sizing.tier 求值，命中才加载。替代旧 when: "config.agents.<key>"
#      开关挂载；二者互斥（不得同时声明，lifecycle-doctor B4 校验 FAIL）。
#      例：plan-reviewer `tiers: [T2]` —— T1 关闭、T2 开启方案审查。
#
# 挂载求值两条独立路径（勿混为一谈）：
#   路径A「when 开关」（feature flag/环境变量语义，非 tier 条件）：
#       - conductor 在 INIT 阶段把当前 tier 的 agents 表写入 task_context.config.agents
#       - agent frontmatter 的 mount[].when 对照 config.agents.<key> 求值
#           true  → 该 agent 在声明挂载点会被加载
#           false/未定义 → 跳过该 agent
#       不依赖 tier——用于按功能开关/环境裁剪挂载
#   路径B「tiers 定级挂载」（同阶段按 tier 差异化）：
#       - 智能体 frontmatter 声明 tiers: [T1,T2] —— 按当前 sizing.tier 求值，
#         命中才加载；不依赖 config.agents 开关（与路径A互斥，不得同时声明）
#   review_mode：none（无验证/审查角色）/ fast（机械门+正向验证，T1）/ full（正向+反向+审查全并行，T2）
#
# tier_escalation：定级自动升级触发器（任务内容/路径命中敏感域 → 强制升 T2）
#   - 触发模式 mode：any（缺省）= 任一关键词组内任一关键词命中 或 任一路径 glob 命中即升级
#                   / all           = 全部 5 个关键词组都命中才升级（更严）
#   - 5 个安全域关键词组 keyword_groups：auth / payment / crypto / security / personal_data
#     每组 ≥ 3 个关键词；命中任一组任一关键词即视为该组匹配
#   - 5 个敏感路径 glob sensitive_path_globs：**/auth/**, **/payment/**, **/crypto/**,
#     **/security/**, **/pii/**（注意 pii ≠ personal_data 关键词组名）；按 minimatch 语义匹配
#   - 升级优先级：tier_escalation 命中 > tier_defaults 当前 tier；
#                 命中后 sizing.tier 强制设为 T2（即使用户声明 T0/T1 也升 T2）
#   - 与 overrides 关系：本段是声明式规则集（默认机制），overrides 段不直接覆盖本段；
#     用户如需关闭特定组，可在 prompt 显式声明 custom_overrides.disable_escalation_groups
#     （黑名单语义，列出要禁用的安全域名）
#
# agents 键命名规则（自动派生，无需手写映射表）：
#   键 = agent 文件名去 .md 后连字符转下划线
# ============================================================
version: 1

tier_defaults:
  # T0 极速通道：INIT → EXECUTING → DELIVERING
  # 无可选视角；恒定挂载智能体（coder）由图拓扑限定自动加载
  T0:
    agents: {}
    review_mode: none

  # T1 标准闭环
  # 恒定挂载：planner/coder/verifier/reviewer/fixer（拓扑可达即加载）
  # model_overrides：T1 快通道 verifier 降级到 deepseek-v4-flash（保留 reasoning，不用 flash-noreason）
  T1:
    agents: {}
    review_mode: fast
    model_overrides:
      verifier: "hx/deepseek-v4-flash"

  # T2 全视角验证：正向+审查全开
  # 适合复杂任务：架构变更、跨多文件重构、安全敏感改动
  T2:
    agents: {}
    review_mode: full

# ============================================================
# tier_escalation：定级自动升级触发器
# 任务内容/路径命中敏感域 → 强制升级 T2（即使 tier_defaults 当前是 T0/T1）
# 语义详见本文件头部 tier_escalation 段说明
# ============================================================
tier_escalation:
  # 触发模式：any（缺省）= 任一关键词组命中或任一路径 glob 命中即升级
  #          all        = 全部 5 个关键词组都命中才升级（更严）
  mode: any

  # 5 个安全域关键词组；任一组任一关键词命中即视为该组匹配
  keyword_groups:
    auth:
      - 权限
      - 认证
      - 登录
      - oauth
      - jwt
      - session
      - rbac
      - 鉴权
    payment:
      - 支付
      - 收款
      - 退款
      - 计费
      - billing
      - invoice
      - 订单金额
    crypto:
      - 加密
      - 解密
      - hash
      - md5
      - sha256
      - rsa
      - aes
      - 签名
    security:
      - 安全
      - 漏洞
      - xss
      - csrf
      - sql注入
      - 越权
      - 风控
      - 防火墙
    personal_data:
      - 身份证
      - 手机号
      - 邮箱
      - 住址
      - pii
      - gdpr
      - 隐私
      - 个人信息

  # 5 个敏感路径 glob（minimatch 语义）；任一文件路径命中即触发
  sensitive_path_globs:
    - "**/auth/**"
    - "**/payment/**"
    - "**/crypto/**"
    - "**/security/**"
    - "**/pii/**"

# ============================================================
# overrides：用户/环境覆盖（默认全空 = 全量自动发现注册）
# ============================================================
overrides:
  # disabled_agents：全局禁用的智能体名列表
  # 被禁用的 agent 不会被 bootstrap 注册；若该 agent 是某阶段 required_roles 唯一履行者 → [ASSEMBLY_FAIL]
  disabled_agents: []

  # model_overrides：覆盖 kilo.json 的模型绑定
  # 键 = agent 名，值 = 模型 ID（能力倾向参考 docs/model-registry.md 人工维护，无机械校验）
  model_overrides: {}

  # condition_overrides：强制覆盖 task_context.config.agents 布尔值
  # 注：config.agents 现仅为 lifecycle-doctor 一致性校验对象，挂载由 mount[].tiers 决定；
  # 此覆盖写字段值供 doctor 校验一致性，不再产生运行时挂载效果。
  # 键 = "config.agents.<key>"，值 = true/false
  condition_overrides: {}

# ============================================================
# custom_overrides：默认自定义覆盖段（conductor 写入 task_context 的初始值）
# 预留扩展点；用户在 prompt 显式声明的覆盖项由 conductor 写入此段。
# ============================================================
custom_overrides: {}

# ============================================================
# hooks：响应式 Hooks 级熔断（v2 新增）
# QUALITY 阶段内部 hooks 自动循环的熔断阈值
# ============================================================
hooks:
  quality:
    max_total_cycles: 3          # QUALITY 总轮次上限（唯一熔断阈值，3轮修不好=方案/需求有问题，escalate到人）
    auto_fix: true              # 自动触发 fix hooks（false = 人工确认后修复）

# ============================================================
# pre-dispatch 安全门阈值（conductor 委派前 size-check 依据）
# 阈值语义：task_context 文件字符数 > 阈值 → [CONTEXT_UNSAFE] → 强制切 agent_manager worktree
# 字符单位说明：当前是字符（char）workaround，非真实 token；中英混合场景下约 1.5 char/token
# 安全系数：阈值已含 2x 缓冲（实测主会话 ~120k 字符仍可承载，250k 触发前有充足预警）
# worktree 兜底保留：超过阈值 → 强制 worktree 而非主会话；该兜底防线不主动禁用
# ============================================================
size_check_threshold: 250000
dispatch_prompt_threshold: 6000   # dispatch-prompt-check 阈值：单次 task prompt 字符数上限（小任务上限 ×1.5 安全系数，可调）
max_files_per_task: 8             # 单次 task 委派涉及文件数上限（3→8：清理 lessons 时多文件 batch 编辑需求；超 8 应回流 PLANNING 拆单元）

# ============================================================
# recovery：自愈/重试引擎阈值（v1 新增，T20260811-001-recovery-engineering）
# max_write_retry     — agent 返回未落盘 execution 时，conductor 自动触发重写的最大次数
# overload_threshold  — 单任务触发 CONTEXT_UNSAFE 次数上限；超 → escalate（避免无限 worktree 切分）
# circuit_breaker_overload — 全局 overload 累计阈值；超 → 整体熔断（与 hooks.quality 联动）
# ============================================================
recovery:
  max_write_retry: 1
  overload_threshold: 3
  circuit_breaker_overload: 5

# ============================================================
# timeouts：阶段/智能体级时间预算（唯一真相来源）
# conductor 启动智能体时记录 start_time；超时 → [AGENT_TIMEOUT]
# 按 graph.yaml 节点 on_fail 字段路由（未声明按默认值规则）
#
# 时间模型：
#   agent_startup_s   — task 工具从调用到首次响应的等待上限（启动阶段独立计时）
#                       超过 → [AGENT_TIMEOUT]（启动卡死）；不计入 stage 预算
#   stage_default_s   — 主槽执行时间上限（启动后到智能体返回）；executor: conductor
#                       内建阶段用此值守卫；per_agent_s 未覆盖的智能体回退此值
#   per_agent_s       — 单智能体执行预算（启动后到返回）；**可选覆盖**——
#                       校验方向单向：每个键必须有对应 agent/*.md 文件（防幽灵键），
#                       但 agent 文件不要求有键（缺省回退 stage_default_s）。
#                       新增智能体零配置即可获得默认预算。
#   实际预算          — per_agent_s[name] × per_tier_multiplier[tier]（缺 per_agent_s
#                       回退 stage_default_s × multiplier）
#
# 守卫范围：
#   - 经 task 工具启动的外部智能体 → per_agent_s / stage_default_s 守卫
#   - executor: conductor 内建阶段 → stage_default_s 守卫（conductor 自身
#     卡住无自动守卫，用户 Ctrl-C 即手动 teardown——开发工具用户在场，不自动销毁）
# ============================================================
timeouts:
  agent_startup_s: 90      # task 工具启动智能体，90s 未响应 → [AGENT_TIMEOUT]
  stage_default_s: 600     # 单阶段默认预算（主槽执行时间上限；内建阶段守卫值）
  per_agent_s:
    coder: 1800            # coder 写代码可能较长，给 30min
    verifier: 900
    reviewer: 600
    planner: 600
    fixer: 1200
  per_tier_multiplier:     # 定级系数（per_agent_s × multiplier = 实际预算）
    T0: 0.5
    T1: 1.0
    T2: 1.5
  retry:
    # timeout 重试配额：仅当节点 on_fail: retry_once 时生效；
    # retry_once 语义 = "同智能体重跑 1 次（新会话，清空前次上下文）"，
    # 此字段限定 [AGENT_TIMEOUT] 后最多重试次数；与节点 on_fail 协同：
    #   on_fail: retry_once + agent_timeout_max_retries: 1 → 重跑 1 次，再超时转 escalate
    #   on_fail: 非 retry_once → 超时直接按 on_fail 派发（不重试）
    agent_timeout_max_retries: 1

# ============================================================
# on_fail 默认值规则（graph.yaml 节点未声明 on_fail 时按此求值）
#   required 必配阶段 → escalate   （升级路径见 conductor.md §异常处理派发表）
#   可选挂载视角    → degrade     （跳过该视角 + DEGRADED）
#   executor 内建   → pause       （挂起 task_context，输出选项等人）
#   START/DONE/terminal → abort   （硬停）
#
# 取值集（节点级 on_fail，与挂载点 mount[].on_fail 同名但取值不同，按字段位置区分）：
#   节点级  on_fail ∈ {abort, retry_once, degrade, escalate, pause}  ← 主槽失败策略
#   挂载点  mount[].on_fail ∈ {abort, warn, skip, degrade}           ← pre:/post:/on:/可选视角失败
# ============================================================

# ============================================================
# runtime：AgentRuntime 横切层配置（v1 新增）
# cost_priority: 模型选择的成本偏好
#   balanced(默认) - 按能力匹配不主动降级
#   quality       - 任务大时优先 kimi-k2.7-code / MiniMax-M3
#   economy       - 小任务主动降级到 small_model
# early_exit_signals: 早退信号词列表（覆盖 default）
# capability_strict: 严格模式=能力缺失时拒绝 dispatch 并 escalate
# ============================================================
runtime:
  cost_priority: balanced
  early_exit_signals: []  # 空=用 early-exit.mjs 内置默认
  capability_strict: false
