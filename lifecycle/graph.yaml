# ============================================================
# 主生命周期 DAG（单一真相来源：图结构）
# 纯拓扑定义：节点 + 边 + 流转条件。本文件是**稳定大框架**——
# 不出现任何智能体名/角色名，新增/删除/替换智能体永不改本文件。
#   - 执行逻辑（输入/处理/输出信号）→ lifecycle/stages/<id-lower>.md（从节点 id 自动派生路径，无需 stage 字段）
#   - 阶段必配角色契约              → lifecycle/stages/<id-lower>.md frontmatter `required_roles`
#   - 智能体挂载（文件路由，唯一机制）→ agent/*.md frontmatter `mount` 字段自注册（v6 单源）
#   - 定级默认组合                    → lifecycle/config.yaml
#   - 收敛熔断阈值                    → lifecycle/config.yaml hooks
# 修改流转 = 改本文件 edges；新增阶段 = 加 node + edges + 丢一个 stages/<id-lower>.md。
# 节点 ID 语义命名，禁止数字前缀——插入中间节点不存在"占号"问题。
# ============================================================
# v3 简化重构：5 阶段生命周期（INIT/PLANNING/EXECUTING/QUALITY/DELIVERING）
#   - INTENT + SIZING 合并为 INIT（conductor 内建，意图判定+定级一步完成）
#   - T3/multiModel/MM_SUBGRAPH 移除
#   - 记忆板块（M4-M8/memory.db）移除，DELIVERING 不再写入记忆
#   - QUALITY=verify→fix(onFail)→verify 循环，熔断 max_total_cycles=3 → CIRCUIT_BREAKER
#   - gate MEMORY_WRITE_COMPLETE 删除
# ============================================================
# M1 折中直通（v3.x 基础上为 INQUIRY 加快速通道，省 coder/QUALITY）：
#   INQUIRY + tier==T0 → INIT→DELIVERING（纯问答极速）
#   INQUIRY + tier in [T1,T2] → INIT→PLANNING→DELIVERING（planner 检索后直通）
#   EXECUTION 仍走 tier-based 全流程（PLANNING→EXECUTING→QUALITY→DELIVERING）
# intent 在 M1 后参与路由（INQUIRY 决定是否跳过 EXECUTING/QUALITY），仍是产物形态标记。
# ============================================================
# 节点字段说明：
#   id        节点 ID（大写蛇形语义名，如 INIT / EXECUTING；禁数字前缀）
#               type: stage 的节点，执行逻辑文件路径自动派生：stages/<id 小写>.md
#               （如 PLANNING → stages/planning.md），无需 stage 字段
#   type      node 类型：
#               virtual   - 占位（如 START），无阶段文件、不挂载智能体
#               stage     - 阶段节点，有 stages/<id-lower>.md 执行逻辑文件（路径自动派生）
#               terminal  - 终态（如 DONE），无阶段文件、不挂载智能体
#   executor  内建执行者（conductor）；声明后该节点主槽不经 task 启动外部智能体
#             未声明 executor 的节点 → 主槽由 frontmatter `mount: at: <NODE>` 注册的智能体填充
#   on_fail   阶段级失败策略（缺省按 lifecycle/config.yaml §on_fail 默认值规则求值）：
#               abort      - 硬停，标 [STAGE_ABORT]，等用户决策
#               retry_once - 同智能体重跑 1 次，再失败 escalate（耗尽见 config.yaml retry.*）
#               degrade    - 跳过该视角 + DEGRADED（仅可选视角节点）
#               escalate   - 升级：T1→T2 加视角，T2→人工；QUALITY 连续失败→reviewer 根因分析
#               pause      - 挂起 task_context，输出选项等用户决策
#             节点 on_fail 在智能体 timeout/error/异常返回时触发；
#             挂载点 mount[].on_fail（abort|warn|skip|degrade）覆盖 pre:/post:/on:/可选视角失败：
#               abort 中止流转 / warn 告警放行 / skip 静默跳过 / degrade 跳过+标 DEGRADED。
#             二者互不干涉。
#
# 边字段说明：
#   from / to    起止节点 ID
#   when         流转条件表达式（对照 task_context 求值）；省略 = 无条件流转
#                常用变量：intent_type / tier / quality_verdict
# ============================================================
# 挂载点（mount）命名空间（派生，零声明——节点存在即挂载点存在）：
#   on:bootstrap   装配完成后、INIT 前（任务启动挂载点）
#   on:done        DELIVERING 完成后、DONE 前（收尾挂载点）
#   pre:<NODE>     节点主槽执行前
#   <NODE>         节点主槽（阶段本体；executor 内建阶段由 conductor 占据）
#   post:<NODE>    节点主槽执行后、edges 流转前
# 需要顺序时声明 after: [agent-name]（相对依赖，只引用前驱），框架自动 topo-sort。
# 阶段必配角色契约在 stages/<id-lower>.md frontmatter `required_roles`（阶段语义内聚）；
# 本文件不声明任何角色——增删智能体、调整挂载、改顺序都不碰本文件。
# ============================================================
version: 3

nodes:
  # 虚拟入口，立即流转至 INIT
  - id: START
    type: virtual

  # 意图判定 + 任务定级（合并原 INTENT + SIZING）：intent=INQUIRY/EXECUTION（M1 后参与路由：INQUIRY 跳过 EXECUTING/QUALITY） + tier=T0/T1/T2
  - id: INIT
    type: stage
    executor: conductor        # conductor 内建执行，不经 task 启动
    on_fail: pause             # 内建阶段失败挂起等人

  # 设计门：方案设计、拆单元 DAG、定义验收标准。T1/T2 EXECUTION 必经；INQUIRY T1+ 必经（出分析方案）；T0 跳过
  # 必配角色契约：stages/planning.md frontmatter required_roles
  - id: PLANNING
    type: stage
    on_fail: retry_once        # 主槽 planner 偶发超时重跑 1 次，再失败 escalate

  # 编码实现：按方案写代码，输出 diff 与验收映射表。EXECUTION 必经；INQUIRY 不经过（M1 直通）
  # 必配角色契约：stages/executing.md frontmatter required_roles
  - id: EXECUTING
    type: stage
    on_fail: retry_once        # 主槽智能体异常/超时 → 重跑 1 次，再失败 escalate

  # 质量保障：响应式 Hooks 阶段（verify → fix(onFail) → verify 循环，review afterPass）
  # 内部 hooks（hook 类型定义顺序，不需要绝对编号）：
  #   hook: verify → verify hooks（verifier 串行组）
  #   hook: fix → fix hooks（fixer, trigger: onFail，任一 verify/review FAIL 时自动触发）
  #   hook: review → review hooks（reviewer, trigger: afterPass）
  # 循环逻辑：代码变化 → 自动触发 verify hooks → 结果变化 → 自动触发 review/fix hooks
  # EXECUTION T1/T2 必经；INQUIRY 不经过（M1 直通）。
  # 必配角色契约：stages/quality.md frontmatter required_roles
  - id: QUALITY
    type: stage
    on_fail: escalate          # 连续失败 → 升级根因分析 / 人工

  # 交付收尾：conductor 内建执行（v7 修复后回归内建模式）、输出闭环确认
  - id: DELIVERING
    type: stage
    executor: conductor        # conductor 内建执行，不经 task 启动（v7 修复后回归内建）
    on_fail: pause             # 内建阶段失败挂起（不自动 commit/push，等人决策）

  # 终态
  - id: DONE
    type: terminal

edges:
  # 虚拟入口 → INIT
  - { from: START, to: INIT }

  # INIT → PLANNING（EXECUTION T1/T2）
  - from: INIT
    to: PLANNING
    when: "intent_type == 'EXECUTION' and tier in ['T1','T2']"

  # INIT → PLANNING（INQUIRY T1/T2，M1：planner 出分析方案）
  - from: INIT
    to: PLANNING
    when: "intent_type == 'INQUIRY' and tier in ['T1','T2']"

  # INIT → EXECUTING（EXECUTION T0，极速通道：无设计门/验证/审查）
  - from: INIT
    to: EXECUTING
    when: "intent_type == 'EXECUTION' and tier == 'T0'"

  # INIT → DELIVERING（INQUIRY T0，M1 直通：纯问答极速，省 coder/QUALITY）
  - from: INIT
    to: DELIVERING
    when: "intent_type == 'INQUIRY' and tier == 'T0'"

  # 设计门完成 → 进入编码（EXECUTION 经 EXECUTING）
  - { from: PLANNING, to: EXECUTING }

  # 设计门完成 → 直通交付（INQUIRY T1+ M1：planner 检索后省 coder/verifier/reviewer）
  - from: PLANNING
    to: DELIVERING
    when: "intent_type == 'INQUIRY'"

  # T0 执行类编码完成 → 直接交付（无验证/审查）
  - from: EXECUTING
    to: DELIVERING
    when: "tier == 'T0'"

  # T1/T2 执行类编码完成 → 进入质量保障
  - from: EXECUTING
    to: QUALITY
    when: "tier in ['T1','T2']"

  # QUALITY 通过 → 进入交付
  - from: QUALITY
    to: DELIVERING
    when: "quality_verdict == 'PASS'"

  # QUALITY 全局熔断 → 挂起等人决策
  - from: QUALITY
    to: DELIVERING
    when: "quality_verdict == 'CIRCUIT_BREAKER'"

  # 交付完成 → 终态（无 gate）
  - { from: DELIVERING, to: DONE }